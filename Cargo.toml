[package]
name = "gitfold"
version = "0.5.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
foldhash = "0.2"
fuser = "0.18.0"
gix = { version = "0.90.0", default-features = false, features = ["attributes", "excludes", "index", "max-performance", "parallel", "revision", "sha1"] }
imara-diff = "0.2.0"
libc = "0.2.191"
log = "0.4.34"
parking_lot = "0.12"
rable = { version = "0.2", default-features = false }
rayon = "1.12.0"
sha1 = "0.11.0"

[lints.clippy]
# Prints go through `out!`/`outln!` (src/out.rs): `println!` panics when
# stdout's reader is gone (`gitfold list | head`).
print_stdout = "deny"
disallowed_methods = "deny"
