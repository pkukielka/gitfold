# On a version tag (v0.1.0, matching Cargo.toml): Linux binaries for x86_64
# and aarch64, as a GitHub release with their SHA256SUMS. The Claude Code
# plugin's bin/gitfold downloads them. Built with cargo-zigbuild against
# glibc 2.28 (RHEL 8, Debian 10, Ubuntu 18.10 and newer); not static: gitfold
# tunes glibc's malloc (mallopt, malloc_trim).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag is Cargo.toml's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build
        run: |
          mkdir dist
          for arch in x86_64 aarch64; do
            cargo zigbuild --release --locked --target "$arch-unknown-linux-gnu.2.28"
            cp "target/$arch-unknown-linux-gnu/release/gitfold" "dist/gitfold-$arch-linux"
          done
          cd dist && sha256sum gitfold-* >SHA256SUMS
      - name: Smoke test
        run: dist/gitfold-x86_64-linux --version
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
